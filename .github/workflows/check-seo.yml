name: Controle SEO-indexeerbaarheid

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/check_seo.py'
      - '.github/workflows/check-seo.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/check_seo.py'
      - '.github/workflows/check-seo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_seo.py
