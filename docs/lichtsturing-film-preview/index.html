<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Lichtsturing mini-film — kandidaat / niet definitief</title>
<style>
  :root { --ink: #1c2330; --muted: #5d6675; --navy: #0b1f4d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #10182a; color: var(--ink); font: 14px/1.4 "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Roboto, Arial, sans-serif; }
  .film { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr auto; }
  .film header { display: flex; flex-wrap: wrap; align-items: baseline; gap: .25rem 1rem; padding: .55rem 1rem; background: #ffe7a8; color: #5a3b00; font-size: .8125rem; }
  .film header b { font-weight: 650; letter-spacing: .02em; }
  .stage { position: relative; min-height: 0; background: #0e1a3c; }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .scene { position: absolute; left: 1rem; top: .75rem; padding: .25rem .6rem; border-radius: 4px; background: rgba(255,255,255,.78); font-weight: 600; font-size: .8125rem; color: var(--ink); }
  .stats { position: absolute; right: 1rem; bottom: .75rem; padding: .25rem .6rem; border-radius: 4px; background: rgba(11,31,77,.82); color: #fff; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; }
  .bar { display: grid; gap: .5rem; padding: .6rem 1rem .8rem; background: #fff; border-top: 1px solid #c9ced6; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .75rem; }
  .bar input[type=range] { flex: 1 1 16rem; accent-color: var(--navy); }
  .bar button { min-height: 36px; padding: 0 .75rem; border: 1px solid #b8bfca; border-radius: 4px; background: #fff; color: var(--ink); font: inherit; font-weight: 600; cursor: pointer; }
  .bar button[data-play] { background: var(--navy); border-color: var(--navy); color: #fff; min-width: 6.5rem; }
  .bar button[aria-pressed=true]:not([data-play]), .bar button[aria-current=true] { background: #e6ecf7; border-color: var(--navy); }
  .bar .grp { display: inline-flex; flex-wrap: wrap; gap: .25rem; }
  .bar [data-time] { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 8rem; }
  .bar label.chk { display: inline-flex; align-items: center; gap: .35rem; color: var(--muted); }
  .scenes button { font-weight: 500; font-size: .8125rem; min-height: 32px; padding: 0 .55rem; }
  .nowebgl { display: none; padding: 2rem; color: #fff; }
  .no-webgl .nowebgl { display: block; }
  .no-webgl .stage, .no-webgl .bar { display: none; }
  @media (max-width: 600px) {
    .bar { padding: .5rem .6rem .7rem; } .film header span { display: none; }
    .bar button { min-height: 40px; padding: 0 .6rem; } .bar input[type=range] { flex-basis: 100%; height: 32px; }
    .scenes { overflow-x: auto; flex-wrap: nowrap; padding-bottom: .2rem; } .scenes button { white-space: nowrap; }
  }
</style>
</head>
<body>
<div class="film">
  <header><b>Lichtsturing mini-film — kandidaat / niet definitief · 25516ea</b><span>Slechte lichtregeling → irritatie → oplossing → goede lichtregeling. Reviewversie met scènekeuze; geen productieversie.</span></header>
  <div class="stage">
    <canvas aria-label="3D-film: een medewerker komt werken, het licht valt door een slecht afgestemde aanwezigheidsregeling steeds uit, hij geeft het op en valt in slaap; een technicus controleert, configureert en test de regeling; daarna werkt de aanwezigheids- en daglichtregeling goed"></canvas>
    <p class="scene" data-scene aria-live="off"></p>
    <p class="stats" data-stats hidden></p>
  </div>
  <div class="bar">
    <div class="row">
      <button type="button" data-play aria-pressed="false">Pauzeer</button>
      <button type="button" data-replay>Opnieuw</button>
      <input type="range" data-scrub min="0" max="104" step="0.01" value="0" aria-label="Tijd">
      <span data-time></span>
    </div>
    <div class="row scenes" data-scenes role="group" aria-label="Scènes"><button type="button" data-full>Hele film</button></div>
    <div class="row">
      <label class="chk"><input type="checkbox" data-loop checked> alleen deze scène</label>
      <span class="grp" role="group" aria-label="Camera"><button type="button" data-view="auto" aria-pressed="true">Auto</button><button type="button" data-view="desktop" aria-pressed="false">Desktop</button><button type="button" data-view="portret" aria-pressed="false">Portret</button></span>
      <span class="grp extra" role="group" aria-label="Snelheid"><button type="button" data-speed="1" aria-pressed="true">1×</button><button type="button" data-speed="0.5" aria-pressed="false">½×</button></span>
      <button type="button" data-stats-toggle>fps</button>
    </div>
  </div>
  <p class="nowebgl">Deze film heeft WebGL nodig (recente Chrome, Edge, Safari of Firefox).</p>
</div>
<script type="module" src="./film.bundle.js"></script>
</body>
</html>
