<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Three.js hero-proef — niet definitief · Lichtsturing.info</title>
<style>
  :root { --ink: #1c2330; --muted: #5d6675; --navy: #0b1f4d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #d9dde3; color: var(--ink); font: 14px/1.4 "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Roboto, Arial, sans-serif; }
  .poc { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr auto; }
  .poc header { display: flex; flex-wrap: wrap; align-items: baseline; gap: .25rem 1rem; padding: .6rem 1rem; background: #ffe7a8; color: #5a3b00; font-size: .8125rem; }
  .poc header b { font-weight: 650; letter-spacing: .02em; }
  .stage { position: relative; min-height: 0; }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .phase { position: absolute; left: 1rem; top: .75rem; padding: .25rem .6rem; border-radius: 4px; background: rgba(255,255,255,.75); font-weight: 600; font-size: .8125rem; }
  .stats { position: absolute; right: 1rem; top: .75rem; padding: .25rem .6rem; border-radius: 4px; background: rgba(11,31,77,.8); color: #fff; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .75rem; padding: .6rem 1rem; background: #fff; border-top: 1px solid #c9ced6; }
  .bar input[type=range] { flex: 1 1 14rem; accent-color: var(--navy); }
  .bar button { min-height: 36px; padding: 0 .8rem; border: 1px solid #b8bfca; border-radius: 4px; background: #fff; color: var(--ink); font: inherit; font-weight: 600; cursor: pointer; }
  .bar button[data-play] { background: var(--navy); border-color: var(--navy); color: #fff; min-width: 6.5rem; }
  .bar button[aria-pressed=true]:not([data-play]) { background: #e6ecf7; border-color: var(--navy); }
  .bar .grp { display: inline-flex; gap: .25rem; }
  .bar [data-time] { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 7.5rem; }
  .nowebgl { display: none; padding: 2rem; }
  .no-webgl .nowebgl { display: block; }
  .no-webgl .stage, .no-webgl .bar { display: none; }
  @media (max-width: 600px) { .bar { gap: .4rem; padding: .5rem .6rem; } .bar button { min-height: 40px; padding: 0 .65rem; } .bar input[type=range] { flex-basis: 100%; order: -1; height: 32px; } .poc header span { display: none; } }
</style>
</head>
<body>
<div class="poc">
  <header><b>Three.js hero-proef — niet definitief · 67a9e07</b><span>Alleen de persoon en een werkplek: lopen, zitten, werken, indutten, slapen, wakker worden, opstaan. Geen productieversie van de hero.</span></header>
  <div class="stage">
    <canvas aria-label="3D-animatie: een persoon komt aanlopen, gaat aan een bureau zitten, werkt, valt in slaap, wordt wakker, rekt zich uit en loopt weg"></canvas>
    <p class="phase" data-phase aria-live="off"></p>
    <p class="stats" data-stats hidden></p>
  </div>
  <div class="bar">
    <button type="button" data-play aria-pressed="false">Pauzeer</button>
    <input type="range" data-scrub min="0" max="40" step="0.01" value="0" aria-label="Tijd">
    <span data-time></span>
    <span class="grp" role="group" aria-label="Camera"><button type="button" data-view="auto" aria-pressed="true">3/4</button><button type="button" data-view="profiel" aria-pressed="false">Profiel</button><button type="button" data-view="dichtbij" aria-pressed="false">Dichtbij</button></span>
    <span class="grp extra" role="group" aria-label="Snelheid"><button type="button" data-speed="1" aria-pressed="true">1×</button><button type="button" data-speed="0.5" aria-pressed="false">½×</button></span>
    <button type="button" data-stats-toggle>fps</button>
  </div>
  <p class="nowebgl">Deze proef heeft WebGL nodig (recente Chrome, Edge, Safari of Firefox).</p>
</div>
<script type="module" src="./poc.bundle.js"></script>
</body>
</html>
